# OpenRouter free-tier Gemma. Default openrouter_query() path (no via_openai):
# temperature/top_p/max_tokens pass straight into POST body. Id must exist
# on /v1/models or OpenRouter returns 4xx.
model: poolside/laguna-s-2.1:free
api: openrouter
max_tokens: 16000
temperature: 0.7
reasoning: {enabled: true}
include_reasoning: true
# top_p: 0.95
read_cost: 0
write_cost: 0
human_readable_id: Laguna-S-2.1 (OpenRouter, free)
batch_processing: false
date: "2026-08-20"
sleep_after_request: 4.0
